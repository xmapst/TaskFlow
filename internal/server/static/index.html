    <script>
      // 首屏防闪：在样式与 JS 加载前就把主题写入根节点。
      // 与 store/theme.ts 的读取逻辑保持一致（同一 localStorage 键）。
      (function () {
        try {
          var stored = localStorage.getItem('aef-theme')
          var mode =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.setAttribute('data-theme', mode)
          document.documentElement.style.background = mode === 'dark' ? '#070b14' : '#eef1f7'
        } catch (error) {
          // localStorage 被禁用时保持默认深色，不阻断渲染
        }
      })()
    </script>
